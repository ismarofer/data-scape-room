# R2A rubric (server only). Actions: remove | pseudonymize | keep | generalize
# ok = best treatments; critical = direct identifiers kept in clear; blocking = loses the join key; anything else = "warn".
# Only the 8 columns the team decides (Radar.tsx): the other 11 of patients.csv are shown as already removed.
max_warn: 1
columns:
  patient_id:  { ok: [keep, pseudonymize] }
  ssn:         { ok: [pseudonymize], critical: [keep], blocking: [remove] }
  first_name:  { ok: [remove], critical: [keep] }
  address:     { ok: [remove], critical: [keep] }
  birthdate:   { ok: [generalize] }
  postal_code: { ok: [generalize] }
  gender:      { ok: [keep] }
  deathdate:   { ok: [keep] }
