target_minutes: 180
# Lumi's help ladder (ADR 012): hints 1-3 lower the confidence by hint_penalty, the full solution by solution_penalty.
# ADR 014: the only meter is the Commission's confidence (meters.trust, 0-100); compliance/quality are kept only for old data.
# Step n unlocks after help_gate_attempts[n-1] failed tries OR help_gate_minutes[n-1] minutes in the level.
# 27-nov: every hint costs 5 (they are much more useful) and the solution 10.
hint_penalty: [5, 5, 5]
solution_penalty: 10
# Each use of an AI character lowers the confidence: every question to Lumi -1. The interviews (Noa, Brais) and the
# dashboard critic are the level itself, so they are free (put 1 to charge them too).
ai_use_penalty: { lumi: 1, npc: 0, critic: 0 }
help_gate_attempts: [0, 1, 2, 2]
help_gate_minutes: [0, 2, 4, 6]
master_key_penalty: 10
ai_credits: 20
show_leaderboard: false
auto_master_key: false
meters_start: { trust: 40, compliance: 70, quality: 40 }
rooms: [R0, R1, R3, R4, R5, R6, FINAL]
