# La Comisión (final). Tres personas NO técnicas, 5 preguntas funcionales (27-nov): lo que preguntaría un cliente de verdad
# (¿cuántos vuelven?, ¿me puedo fiar?, ¿dónde me fijo?, ¿están protegidos los pacientes?, ¿qué hacemos mañana?).
# Debajo de la pregunta el equipo ve un resumen de su trabajo en tarjetas (commission.ts → summary) para poder responder.
# Las preguntas por plantilla se eligen según las decisiones del equipo; con IA live se reformulan a partir de las mismas
# decisiones y se cae a esta plantilla si el modelo tarda o falla.
turns: 5
personas:
  - id: valcarcel
    name: "Dra. Marta Valcárcel"
    role: { es: "Directora Médica y presidenta de la Comisión", gl: "Directora Médica e presidenta da Comisión" }
    focus: { es: "Quiere entender la situación de sus pacientes en palabras sencillas y decidir qué hacer. No sabe de datos ni de informática.", gl: "Quere entender a situación dos seus pacientes en palabras sinxelas e decidir que facer. Non sabe de datos nin de informática." }
  - id: pardo
    name: "Xaquín Pardo"
    role: { es: "Gerente del hospital", gl: "Xerente do hospital" }
    focus: { es: "Pragmático: le preocupa poder fiarse de la cifra y no tener problemas con los datos de los pacientes. No sabe de datos ni de informática.", gl: "Pragmático: preocúpalle poder fiarse da cifra e non ter problemas cos datos dos pacientes. Non sabe de datos nin de informática." }
  - id: louzao
    name: "Carmen Louzao"
    role: { es: "Enfermera jefa", gl: "Enfermeira xefa" }
    focus: { es: "Organiza a las enfermeras de planta; quiere saber dónde fijarse y qué hacer en el día a día. No sabe de datos ni de informática.", gl: "Organiza as enfermeiras de planta; quere saber onde fixarse e que facer no día a día. Non sabe de datos nin de informática." }
# turno -> persona
order: [valcarcel, pardo, louzao, pardo, valcarcel]
questions:
  q_cifra:
    es: "Empecemos por lo básico: de cada 100 pacientes a los que damos el alta, ¿cuántos vuelven a ingresar antes de un mes? ¿Os parece mucho o poco?"
    gl: "Comecemos polo básico: de cada 100 pacientes aos que lles damos a alta, cantos volven ingresar antes dun mes? Parécevos moito ou pouco?"
  q_fiar_ok:
    es: "Antes de llevar esa cifra al Consejo necesito saber si me puedo fiar de ella. ¿Qué problemas tenían los datos y qué hicisteis para que no la inflaran?"
    gl: "Antes de levar esa cifra ao Consello preciso saber se me podo fiar dela. Que problemas tiñan os datos e que fixestes para que non a inchasen?"
  q_fiar_dup:
    es: "Me cuentan que, con el fichero que un hospital mandó dos veces, se os quedaron visitas repetidas. ¿Me puedo fiar entonces de la cifra? ¿Qué cambiaríais?"
    gl: "Cóntanme que, co ficheiro que un hospital mandou dúas veces, quedáronvos visitas repetidas. Podo fiarme entón da cifra? Que cambiariades?"
  q_donde:
    es: "Yo organizo a las enfermeras de planta. ¿Hay algún hospital o algún tipo de paciente en el que deba fijarme más?"
    gl: "Eu organizo as enfermeiras de planta. Hai algún hospital ou algún tipo de paciente no que deba fixarme máis?"
  q_priv_ok:
    es: "Si mañana un paciente me pregunta si su nombre ha estado en vuestro ordenador, ¿qué le digo? ¿Podría alguien saber quién es quién con lo que habéis usado?"
    gl: "Se mañá un paciente me pregunta se o seu nome estivo no voso ordenador, que lle digo? Podería alguén saber quen é quen co que usastes?"
  q_priv_bad:
    es: "Me han dicho que en algún momento quedó a la vista un dato que identificaba a los pacientes. ¿Qué pasó y cómo me aseguráis que no vuelve a ocurrir?"
    gl: "Dixéronme que nalgún momento quedou á vista un dato que identificaba os pacientes. Que pasou e como me asegurades que non volve ocorrer?"
  q_next:
    es: "Tengo que decidir hoy. ¿Qué nos recomendáis hacer a partir de mañana? ¿Y qué no deberíamos hacer todavía?"
    gl: "Teño que decidir hoxe. Que nos recomendades facer a partir de mañá? E que non deberiamos facer aínda?"
  q_next_ml:
    es: "Tengo que decidir hoy. ¿Qué nos recomendáis hacer a partir de mañana? Y esa herramienta que avisa de los pacientes con riesgo de volver, ¿la ponemos ya en marcha?"
    gl: "Teño que decidir hoxe. Que nos recomendades facer a partir de mañá? E esa ferramenta que avisa dos pacientes con risco de volver, poñémola xa en marcha?"
# what a good answer contains, one per turn (shown under the question)
tips:
  - { es: "La cifra global dicha en palabras («unos X de cada 100») y si os parece alta o baja. Está en la tarjeta «La cifra».", gl: "A cifra global dita en palabras («uns X de cada 100») e se vos parece alta ou baixa. Está na tarxeta «A cifra»." }
  - { es: "Uno o dos problemas que encontrasteis en los datos y qué hicisteis con ellos. Mirad «Los datos» y «Datos raros».", gl: "Un ou dous problemas que atopastes nos datos e que fixestes con eles. Mirade «Os datos» e «Datos raros»." }
  - { es: "El hospital con más reingresos y por qué el más pequeño no cuenta. Si queréis, el grupo de edad. Mirad «Dónde» y «Por edad».", gl: "O hospital con máis reingresos e por que o máis pequeno non conta. Se queredes, o grupo de idade. Mirade «Onde» e «Por idade»." }
  - { es: "Qué datos personales quitasteis o cambiasteis, en palabras sencillas. Mirad «Privacidad».", gl: "Que datos persoais quitastes ou cambiastes, en palabras sinxelas. Mirade «Privacidade»." }
  - { es: "Una o dos acciones concretas (por ejemplo, revisar las altas del hospital con más reingresos) y una cosa que todavía no sabéis.", gl: "Unha ou dúas accións concretas (por exemplo, revisar as altas do hospital con máis reingresos) e unha cousa que aínda non sabedes." }
endings:
  approved:
    title: { es: "Plan aprobado", gl: "Plan aprobado" }
    text: { es: "La Comisión aprueba vuestro plan: la cifra es clara, honesta con sus límites y la acción propuesta es viable. Habéis convencido a quien decide.", gl: "A Comisión aproba o voso plan: a cifra é clara, honesta cos seus límites e a acción proposta é viable. Convencestes a quen decide." }
  conditions:
    title: { es: "Aprobado con condiciones", gl: "Aprobado con condicións" }
    text: { es: "La Comisión aprueba vuestro plan con condiciones: pide reforzar algunos puntos antes de actuar. Es un resultado muy sólido: así se trabaja de verdad.", gl: "A Comisión aproba o voso plan con condicións: pide reforzar algúns puntos antes de actuar. É un resultado moi sólido: así se traballa de verdade." }
  more_data:
    title: { es: "Piden más datos", gl: "Piden máis datos" }
    text: { es: "La Comisión pide más datos antes de decidir. No es un fracaso: pedir más evidencia ante una duda razonable también forma parte del buen trabajo con datos.", gl: "A Comisión pide máis datos antes de decidir. Non é un fracaso: pedir máis evidencia ante unha dúbida razoable tamén forma parte do bo traballo con datos." }
badges:
  ojo_halcon: { es: "Ojo de halcón", gl: "Ollo de falcón", why: { es: "Detectasteis las afirmaciones falsas de Ada a la primera.", gl: "Detectastes as afirmacións falsas de Ada á primeira." } }
  cero_fugas: { es: "Cero fugas", gl: "Cero fugas", why: { es: "No dejasteis en claro ningún dato identificativo.", gl: "Non deixastes en claro ningún dato identificativo." } }
  auditor_ia: { es: "Auditor/a de IA", gl: "Auditor/a de IA", why: { es: "Comprobasteis lo que decía una IA con los datos.", gl: "Comprobastes o que dicía unha IA cos datos." } }
  detective: { es: "Detective forense", gl: "Detective forense", why: { es: "Investigasteis y resolvisteis las anomalías de los datos.", gl: "Investigastes e resolvestes as anomalías dos datos." } }
  sin_atajos: { es: "Sin atajos", gl: "Sen atallos", why: { es: "No usasteis la llave maestra en ningún candado.", gl: "Non usastes a chave mestra en ningún cadeado." } }
  esquema_estelar: { es: "Esquema estelar", gl: "Esquema estelar", why: { es: "Dibujasteis el esquema en estrella a la primera.", gl: "Debuxastes o esquema en estrela á primeira." } }
  cartografo: { es: "Cartógrafo/a", gl: "Cartógrafo/a", why: { es: "Vuestro dashboard pasó la revisión del crítico a la primera.", gl: "O voso dashboard pasou a revisión do crítico á primeira." } }
  etica_primero: { es: "Ética primero", gl: "Ética primeiro", why: { es: "Revisasteis la equidad del modelo antes de usarlo.", gl: "Revistes a equidade do modelo antes de usalo." } }
