id: brais
name: Brais
role: { es: "Admisiones", gl: "Admisións" }
persona: { es: "Hablador y cercano. Sabe cómo se registran los ingresos y se abre si le preguntan por su trabajo.", gl: "Falador e achegado. Sabe como se rexistran os ingresos e ábrese se lle preguntan polo seu traballo." }
max_questions: 6
greeting: { es: "¡Ey! Pasad, pasad. ¿Café? Decidme qué necesitáis de Admisiones.", gl: "Ei! Pasade, pasade. Café? Dicídeme que precisades de Admisións." }
facts:
  - id: C2
    text: { es: "En el turno de noche las altas se registran a mano y a veces con la hora local equivocada, así que algunas fechas de alta salen desplazadas.", gl: "No turno de noite as altas rexístranse a man e ás veces coa hora local equivocada, así que algunhas datas de alta saen desprazadas." }
    reveal_all: [["noche", "noite", "turno", "quenda", "nocturn", "madrugad", "a mano", "a man"]]
  - id: C3
    text: { es: "El registro de defunciones llega con semanas de retraso, por eso hay pacientes con ingresos registrados después de fallecer.", gl: "O rexistro de defuncións chega con semanas de atraso, por iso hai pacientes con ingresos rexistrados despois de falecer." }
    reveal_all: [["defunci", "fallec", "falec", "muert", "morte", "óbito", "obito", "murió", "morreu"]]
fallback:
  - { es: "¡Preguntad lo que queráis! Yo controlo dos cosas: los turnos (también el de noche) y los registros de defunciones. ¿Por cuál empezamos?", gl: "Preguntade o que queirades! Eu controlo dúas cousas: as quendas (tamén a de noite) e os rexistros de defuncións. Por cal comezamos?" }
  - { es: "Admisiones es un hormiguero, ¡pero me encanta! Si queréis, os cuento cómo se registran las altas de noche o cuándo nos llegan las defunciones.", gl: "Admisións é un formigueiro, pero encántame! Se queredes, cóntovos como se rexistran as altas de noite ou cando nos chegan as defuncións." }
  - { es: "Mmm, no sé muy bien por dónde vais. ¿Os interesan los turnos de noche o los registros de fallecimientos?", gl: "Mmm, non sei moi ben por onde ides. Interésanvos as quendas de noite ou os rexistros de falecementos?" }
off_topic: { es: "Jajaja, eso no es lo mío. Yo sé de turnos, altas y defunciones: ¡preguntadme por eso!", gl: "Jajaja, iso non é o meu. Eu sei de quendas, altas e defuncións: preguntádeme por iso!" }
