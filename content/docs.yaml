# Documentos del proyecto (carpeta docs/ del explorador). Aparecen al alcanzar el primer candado que los necesita (docs_needed).
# El cuerpo admite un Markdown sencillo: ## títulos, listas con "- " o "1. ", tablas con "|", **negrita** y `código`.
- id: doc_de_specs
  path: docs/especificaciones-ficheros.md
  title: { es: "Hoja de especificaciones de ficheros", gl: "Folla de especificacións de ficheiros" }
  body:
    es: |
      Este documento resume lo que **dicen los hospitales** sobre los ficheros que han enviado, y te explica cómo **comprobarlo tú**. Léelo antes de cargar nada en la sala «La bandeja de entrada».

      ## Qué es cada fichero
      | Fichero | Qué contiene | Una fila es… |
      |---|---|---|
      | `patients.csv` | Los pacientes | una persona (su ficha) |
      | `organizations.csv` | Los centros sanitarios | un hospital o clínica |
      | `conditions.csv` | Diagnósticos | un problema de salud diagnosticado en una visita |
      | `encounters_H1.csv`, `_H2`, `_H3`, `_H4` | Encuentros (visitas) de cada envío de hospitales | una visita de un paciente al hospital |
      | `encounters_H2_reenvio.csv` | Segundo envío del fichero de H2 | una visita (versión corregida o repetida) |

      Un **encuentro** es cada vez que un paciente pasa por el hospital: una consulta, una urgencia, un ingreso… Todos los ficheros de encuentros llevan `loaded_at`: cuándo se cargó *esa versión* de la fila en el sistema del hospital.

      ## Lo que dicen las hojas de especificaciones
      Cada hospital envía una hoja con el formato de su fichero. Esto es lo que declaran:
      | Ficheros | Separador | Codificación | Fechas |
      |---|---|---|---|
      | patients, organizations, conditions | coma `,` | UTF-8 | (sin fechas de hora) |
      | encounters_H1, H2, H4 y reenvío | coma `,` | UTF-8 | `2023-01-31 14:05:00` |
      | encounters_H3 | punto y coma `;` | UTF-8 | `31/01/2023 14:05` |

      Aviso de Noa (Informática): «las hojas las rellena cada hospital a mano y a veces se equivocan; **fiaos de los datos**, no solo del papel».

      ## Cómo comprobar el formato de un fichero
      Elige el fichero en el cargador y mira el contador de arriba de la tabla («filas buenas · rechazadas · columnas»):
      - **Separador.** Si ves **una sola columna enorme**, el separador es otro. Prueba con punto y coma. Con el separador correcto, el número de columnas coincide con el de la cabecera (`encounters`: 8; `patients`: 19).
      - **Codificación.** Si en lugar de tildes ves símbolos como `Ã³` o `�`, la codificación está mal: prueba con la otra. «Codificación» es el código con el que un fichero guarda las letras; UTF-8 y Latin-1 guardan las tildes de forma distinta.
      - **Formato de fecha.** Mira cómo se escribe `start_ts` en la tabla y elige el formato que coincida. Si no coincide, casi todas las filas salen **rechazadas** («fecha ilegible»).

      ## Filas rechazadas
      Una fila se rechaza cuando no encaja con las reglas elegidas (le faltan columnas o su fecha no se entiende). Si, tras elegir bien separador, codificación y fecha, **aún quedan unas pocas rechazadas**, es que esas líneas llegan **cortadas en el propio fichero**: es normal, se descartan y se anotan. Pulsa «Ver filas rechazadas» para verlas.

      ## Antes de «Validar carga»
      Comprueba que los **8 ficheros** tienen ✔ y que el número de filas buenas tiene sentido (los ficheros de H1 y H4 son los más grandes). Anota cualquier rechazo: más adelante hay que contárselo a la Comisión.
    gl: |
      Este documento resume o que **din os hospitais** sobre os ficheiros que enviaron, e explícache como **comprobalo ti**. Léeo antes de cargar nada na sala «A caixa de entrada».

      ## Que é cada ficheiro
      | Ficheiro | Que contén | Unha fila é… |
      |---|---|---|
      | `patients.csv` | Os pacientes | unha persoa (a súa ficha) |
      | `organizations.csv` | Os centros sanitarios | un hospital ou clínica |
      | `conditions.csv` | Diagnósticos | un problema de saúde diagnosticado nunha visita |
      | `encounters_H1.csv`, `_H2`, `_H3`, `_H4` | Encontros (visitas) de cada envío de hospitais | unha visita dun paciente ao hospital |
      | `encounters_H2_reenvio.csv` | Segundo envío do ficheiro de H2 | unha visita (versión corrixida ou repetida) |

      Un **encontro** é cada vez que un paciente pasa polo hospital: unha consulta, unha urxencia, un ingreso… Todos os ficheiros de encontros levan `loaded_at`: cando se cargou *esa versión* da fila no sistema do hospital.

      ## O que din as follas de especificacións
      Cada hospital envía unha folla co formato do seu ficheiro. Isto é o que declaran:
      | Ficheiros | Separador | Codificación | Datas |
      |---|---|---|---|
      | patients, organizations, conditions | coma `,` | UTF-8 | (sen datas con hora) |
      | encounters_H1, H2, H4 e reenvío | coma `,` | UTF-8 | `2023-01-31 14:05:00` |
      | encounters_H3 | punto e coma `;` | UTF-8 | `31/01/2023 14:05` |

      Aviso de Noa (Informática): «as follas énchea cada hospital a man e ás veces equivócanse; **fiádevos dos datos**, non só do papel».

      ## Como comprobar o formato dun ficheiro
      Elixe o ficheiro no cargador e mira o contador de arriba da táboa («filas boas · rexeitadas · columnas»):
      - **Separador.** Se ves **unha soa columna enorme**, o separador é outro. Proba con punto e coma. Co separador correcto, o número de columnas coincide co da cabeceira (`encounters`: 8; `patients`: 19).
      - **Codificación.** Se en lugar de tiles ves símbolos como `Ã³` ou `�`, a codificación está mal: proba coa outra. «Codificación» é o código co que un ficheiro garda as letras; UTF-8 e Latin-1 gardan as tiles de forma distinta.
      - **Formato de data.** Mira como se escribe `start_ts` na táboa e elixe o formato que coincida. Se non coincide, case todas as filas saen **rexeitadas** («data ilexible»).

      ## Filas rexeitadas
      Unha fila rexéitase cando non encaixa coas regras elixidas (fáltanlle columnas ou a súa data non se entende). Se, tras elixir ben separador, codificación e data, **aínda quedan unhas poucas rexeitadas**, é que esas liñas chegan **cortadas no propio ficheiro**: é normal, descártanse e anótanse. Preme «Ver filas rexeitadas» para velas.

      ## Antes de «Validar carga»
      Comproba que os **8 ficheiros** teñen ✔ e que o número de filas boas ten sentido (os ficheiros de H1 e H4 son os máis grandes). Anota calquera rexeitamento: máis adiante hai que contarllo á Comisión.
- id: doc_de_keys
  path: docs/claves-y-capas.md
  title: { es: "Claves, capas y modelos de datos", gl: "Claves, capas e modelos de datos" }
  body:
    es: |
      Este documento reúne lo que necesitas para construir los modelos de datos (sala 3): qué es una clave, cómo se organizan las capas, cómo se protege cada modelo con tests y cómo se diseña un esquema en estrella.

      ## Claves: cómo identificar «una cosa»
      Una **clave** es la columna (o columnas) que identifica cada fila de forma **única**.
      - Un **encuentro** se identifica por `encounter_id`. Si el mismo `encounter_id` sale dos veces en un modelo, hay un **duplicado** y las cuentas salen infladas.
      - Una **persona** se identifica por su **SSN** (número de identificación), **no por su nombre**: dos personas distintas pueden llamarse igual y haber nacido el mismo día. La ficha (`patient_id`) tampoco sirve para contar personas, porque una misma persona puede tener varias fichas.
      - Un **centro** se identifica por `organization_id`.
      Como el SSN es un dato personal, en los modelos se usa un **seudónimo**: un código derivado del SSN con una «sal» (un texto secreto añadido antes de calcular el hash). La misma persona da siempre el mismo código, pero nadie puede recuperar el SSN a partir de él.

      ## Las capas: de los datos en bruto a los números
      | Capa | Prefijo | Qué hace |
      |---|---|---|
      | 🥉 **Bronce · raw** | (tablas `raw.*`) | Datos **tal cual llegan**: todo es texto y hay formatos mezclados. No se toca. |
      | 🥈 **Plata · staging** | `stg_` | Limpieza: convertir tipos (fechas de verdad), unificar valores (`Inpatient`, `INPATIENT ` → `inpatient`) y quitar duplicados. Una tabla por fuente. |
      | 🥇 **Oro (parte 1) · intermedio** | `int_` | Pasos de cálculo: por ejemplo, agrupar visitas en **episodios**. |
      | 🥇 **Oro · marts** (informe) | `fct_`, `dim_` | Lo que se mide y se enseña: tablas listas para contar. |
      Esta organización en tres niveles de calidad se llama **arquitectura medallón** (bronce, plata y oro). Fíjate en el panel **BASE DE DATOS** de la izquierda: agrupa las tablas con esas mismas capas, y el contenido de cada una se va a pareciendo más a lo que necesitas medir según subes de bronce a oro. **Bronce** se conserva siempre intacto, así puedes rehacer todo si algo sale mal.
      Las capas se construyen **en este orden**, y cada una usa solo la anterior (`ref()` en dbt). Así, si hay un fallo, sabes en qué paso mirar.

      ## Cada hueco del modelo es una decisión
      En el constructor de modelos eliges una pieza de SQL para cada hueco. Piensa siempre: *¿qué problema real de los datos arregla esta pieza?*
      - **Convertir fechas:** unas filas traen `2023-01-31 14:05:00` y otras `31/01/2023 14:05`. Una conversión que solo entiende un formato **deja vacías** las demás (y no avisa).
      - **Tipo de encuentro:** `inpatient`, `Inpatient` e `INPATIENT ` son el mismo valor escrito de tres formas; hay que dejar uno solo.
      - **Duplicados:** cuando un encuentro llega dos veces, se queda **una fila por `encounter_id`: la cargada más recientemente** (`loaded_at` más alto).
      - **Clave de paciente:** un código estable por persona que no muestre el dato original.

      ## Los tests: el seguro de cada modelo
      Un **test** es una comprobación automática. Los más habituales:
      - `not_null`: la columna no tiene huecos (p. ej. toda visita tiene fecha de inicio).
      - `unique`: no hay valores repetidos (cada `encounter_id` aparece una vez).
      - `relationships`: todo valor de una columna existe en otra tabla (todo `patient_id` de los encuentros existe en pacientes).
      - `accepted_values`: solo hay valores permitidos (tipos de encuentro válidos).
      Si un test falla, el mensaje te dice **qué** y **cuántas filas**: úsalo como pista de qué pieza del modelo está mal elegida. Un modelo no se entrega hasta que todos los tests están en verde.

      ## Episodios y reingresos (sala 3)
      - Un **episodio** agrupa visitas seguidas: si entre el alta de un ingreso y el siguiente pasa **un día o menos**, es el mismo episodio (traslado interno o alta-reingreso administrativo).
      - Un **reingreso** es un ingreso que ocurre **pasado ese margen** y dentro de la ventana que fija el protocolo, contando desde el alta del episodio anterior. Si la ventana está mal escrita, el número de reingresos cambia: por eso hay que leer el protocolo con calma.
      - Solo cuentan los **ingresos hospitalarios** (`inpatient`).

      ## Esquema en estrella (sala 3)
      Un **esquema en estrella** organiza las tablas en dos tipos:
      - **Tablas de hechos** (`fct_`): guardan **lo que ocurre** y se puede contar o sumar: un ingreso, un diagnóstico.
      - **Tablas de dimensiones** (`dim_`): **describen** los hechos: quién (`dim_patient`), dónde (`dim_hospital`), cuándo (`dim_date`).
      Reglas del dibujo: cada hecho se **une a las dimensiones** que lo describen (un ingreso tiene fecha, hospital y paciente; un diagnóstico tiene fecha y paciente); las **dimensiones no se unen entre sí**; y un hecho no se une a otro hecho. Fíjate en que el dibujo parece una estrella: el hecho en el centro y las dimensiones alrededor.
    gl: |
      Este documento reúne o que necesitas para construír os modelos de datos (sala 3): que é unha clave, como se organizan as capas, como se protexe cada modelo con tests e como se deseña un esquema en estrela.

      ## Claves: como identificar «unha cousa»
      Unha **clave** é a columna (ou columnas) que identifica cada fila de forma **única**.
      - Un **encontro** identifícase por `encounter_id`. Se o mesmo `encounter_id` sae dúas veces nun modelo, hai un **duplicado** e as contas saen inchadas.
      - Unha **persoa** identifícase polo seu **SSN** (número de identificación), **non polo seu nome**: dúas persoas distintas poden chamarse igual e nacer o mesmo día. A ficha (`patient_id`) tampouco serve para contar persoas, porque unha mesma persoa pode ter varias fichas.
      - Un **centro** identifícase por `organization_id`.
      Como o SSN é un dato persoal, nos modelos úsase un **pseudónimo**: un código derivado do SSN cunha «sal» (un texto secreto engadido antes de calcular o hash). A mesma persoa dá sempre o mesmo código, pero ninguén pode recuperar o SSN a partir del.

      ## As capas: dos datos en bruto aos números
      | Capa | Prefixo | Que fai |
      |---|---|---|
      | 🥉 **Bronce · raw** | (táboas `raw.*`) | Datos **tal cal chegan**: todo é texto e hai formatos mesturados. Non se toca. |
      | 🥈 **Prata · staging** | `stg_` | Limpeza: converter tipos (datas de verdade), unificar valores (`Inpatient`, `INPATIENT ` → `inpatient`) e quitar duplicados. Unha táboa por fonte. |
      | 🥇 **Ouro (parte 1) · intermedio** | `int_` | Pasos de cálculo: por exemplo, agrupar visitas en **episodios**. |
      | 🥇 **Ouro · marts** (informe) | `fct_`, `dim_` | O que se mide e se amosa: táboas listas para contar. |
      Esta organización en tres niveis de calidade chámase **arquitectura medalla** (bronce, prata e ouro). Fíxate no panel **BASE DE DATOS** da esquerda: agrupa as táboas con esas mesmas capas, e o contido de cada unha vai parecéndose máis ao que precisas medir segundo sobes de bronce a ouro. **Bronce** consérvase sempre intacto, así podes refacer todo se algo sae mal.
      As capas constrúense **nesta orde**, e cada unha usa só a anterior (`ref()` en dbt). Así, se hai un fallo, sabes en que paso mirar.

      ## Cada oco do modelo é unha decisión
      No construtor de modelos elixes unha peza de SQL para cada oco. Pensa sempre: *que problema real dos datos arranxa esta peza?*
      - **Converter datas:** unhas filas traen `2023-01-31 14:05:00` e outras `31/01/2023 14:05`. Unha conversión que só entende un formato **deixa baleiras** as demais (e non avisa).
      - **Tipo de encontro:** `inpatient`, `Inpatient` e `INPATIENT ` son o mesmo valor escrito de tres formas; hai que deixar un só.
      - **Duplicados:** cando un encontro chega dúas veces, queda **unha fila por `encounter_id`: a cargada máis recentemente** (`loaded_at` máis alto).
      - **Clave de paciente:** un código estable por persoa que non amose o dato orixinal.

      ## Os tests: o seguro de cada modelo
      Un **test** é unha comprobación automática. Os máis habituais:
      - `not_null`: a columna non ten ocos (p. ex. toda visita ten data de inicio).
      - `unique`: non hai valores repetidos (cada `encounter_id` aparece unha vez).
      - `relationships`: todo valor dunha columna existe noutra táboa (todo `patient_id` dos encontros existe en pacientes).
      - `accepted_values`: só hai valores permitidos (tipos de encontro válidos).
      Se un test falla, a mensaxe dísache **que** e **cantas filas**: úsao como pista de que peza do modelo está mal elixida. Un modelo non se entrega ata que todos os tests están en verde.

      ## Episodios e reingresos (sala 3)
      - Un **episodio** agrupa visitas seguidas: se entre a alta dun ingreso e o seguinte pasa **un día ou menos**, é o mesmo episodio (traslado interno ou alta-reingreso administrativo).
      - Un **reingreso** é un ingreso que ocorre **pasado ese marxe** e dentro da ventá que fixa o protocolo, contando desde a alta do episodio anterior. Se a ventá está mal escrita, o número de reingresos cambia: por iso hai que ler o protocolo con calma.
      - Só contan os **ingresos hospitalarios** (`inpatient`).

      ## Esquema en estrela (sala 3)
      Un **esquema en estrela** organiza as táboas en dous tipos:
      - **Táboas de feitos** (`fct_`): gardan **o que ocorre** e se pode contar ou sumar: un ingreso, un diagnóstico.
      - **Táboas de dimensións** (`dim_`): **describen** os feitos: quen (`dim_patient`), onde (`dim_hospital`), cando (`dim_date`).
      Regras do debuxo: cada feito **únese ás dimensións** que o describen (un ingreso ten data, hospital e paciente; un diagnóstico ten data e paciente); as **dimensións non se unen entre si**; e un feito non se une a outro feito. Fíxate en que o debuxo parece unha estrela: o feito no centro e as dimensións arredor.
- id: doc_de_privacy
  path: docs/guia-privacidad.md
  title: { es: "Guía de privacidad: qué hacer con cada columna", gl: "Guía de privacidade: que facer con cada columna" }
  body:
    es: |
      Antes de que nadie analice la tabla de pacientes hay que decidir, **columna por columna**, qué se hace con ella. Esta guía te explica las cuatro acciones, cómo decidir y qué hacer con **cada una de las 19 columnas** de `patients`.

      ## Por qué importa
      Los datos de salud están especialmente protegidos por la ley (RGPD). Aunque aquí sean ficticios, trabajamos **como si fueran reales**. Regla de oro: **usar solo lo necesario** y proteger lo que identifica a una persona.

      ## Las cuatro acciones
      | Acción | Qué es | Cuándo se usa | Ejemplo |
      |---|---|---|---|
      | **Eliminar** | La columna se borra del modelo | No hace falta para nada del proyecto o identifica directamente | Nombre, dirección |
      | **Pseudonimizar** | Se cambia el dato por un **código inventado y estable** (un *hash con sal*): la misma persona da siempre el mismo código | Se necesita para **unir fichas**, pero no para **mostrar** quién es | SSN |
      | **Generalizar** | El dato se hace **menos exacto** (un tramo en vez del valor) | Es útil pero demasiado exacto | Fecha de nacimiento → tramo de edad |
      | **Mantener** | Se queda tal cual | No identifica y se necesita | Provincia |

      ## Cómo decidir: 3 preguntas por columna
      1. ¿**Identifica directamente** a una persona (nombre, número oficial, dirección exacta)? Entonces **no puede quedar en claro**: se elimina… salvo que haga falta para unir fichas, y entonces se **pseudonimiza**.
      2. ¿**Hace falta** para el análisis? Si no, se **elimina**: menos datos, menos riesgo.
      3. Si hace falta pero es **muy exacta**, se **generaliza**. Si no es peligrosa, se **mantiene**.

      ## Las combinaciones también identifican
      Algunos datos no identifican por sí solos, pero **combinados** sí: la **fecha de nacimiento + el código postal + el sexo** bastan para reconocer a mucha gente. Por eso esas columnas se **generalizan** aunque cada una parezca inofensiva.

      ## Las 19 columnas de `patients`
      | Columna | Qué contiene | Riesgo | Qué hacer y por qué |
      |---|---|---|---|
      | `patient_id` | Código interno de la ficha (aleatorio) | Bajo: no significa nada fuera del hospital | **Mantener**: es lo que une la ficha con sus encuentros. |
      | `ssn` | Número de identificación de la persona | **Muy alto** (directo) | **Pseudonimizar**: es lo único que permite saber que dos fichas son la misma persona, así que se necesita para unir, pero no se muestra. *No* dejarlo en claro y *no* eliminarlo. |
      | `drivers` | Carnet de conducir | **Muy alto** (directo) | **Eliminar**: no hace falta. |
      | `passport` | Pasaporte | **Muy alto** (directo) | **Eliminar**: no hace falta. |
      | `prefix` | Tratamiento (Sr., Sra.) | Bajo | **Eliminar**: no aporta nada al análisis. |
      | `first_name` | Nombre | **Alto** (directo) | **Eliminar**. Y no unas fichas por nombre: personas distintas se llaman igual. |
      | `last_name` | Apellidos | **Alto** (directo) | **Eliminar**, igual que el nombre. |
      | `marital` | Estado civil | Bajo, pero se combina con otros | **Eliminar**: no hace falta para medir reingresos. |
      | `birthdate` | Fecha de nacimiento exacta | **Alto** combinada con código postal y sexo | **Generalizar** a **tramo de edad**: la edad sí importa (los mayores reingresan más), el día exacto no. |
      | `deathdate` | Fecha de fallecimiento | Medio | **Mantener**: el protocolo exige excluir los registros **posteriores al fallecimiento**, y sin esta fecha no se puede. |
      | `birthplace` | Pueblo de nacimiento | Medio | **Eliminar** (o generalizar): no se necesita. |
      | `address` | Calle y número | **Muy alto** (directo) | **Eliminar**. |
      | `city` | Ciudad de residencia | Medio: en una ciudad pequeña casi se señala a alguien | **Generalizar** (a un área mayor) o eliminar. |
      | `state` | Comunidad autónoma | Bajo | **Mantener**: es un nivel muy amplio. |
      | `county` | Provincia | Bajo | **Mantener**: nivel amplio y útil para comparar zonas. |
      | `postal_code` | Código postal | **Alto** combinado con nacimiento y sexo | **Generalizar** (por ejemplo, solo las primeras cifras o el área sanitaria). |
      | `gender` | Sexo | Bajo, pero es una variable sensible | **Mantener**: es útil y permite comprobar que el análisis no es injusto con un sexo concreto. |
      | `lat` | Latitud GPS del domicilio | **Muy alto**: señala una vivienda | **Eliminar**. |
      | `lon` | Longitud GPS del domicilio | **Muy alto**: señala una vivienda | **Eliminar**. |

      ## Errores típicos
      - **Eliminar el SSN.** Parece lo más seguro, pero después **no podréis unir las fichas duplicadas** de una misma persona. Hay que pseudonimizarlo.
      - **Dejar el SSN (o el nombre, la dirección, el carnet o el pasaporte) en claro.** Es el fallo más grave: baja el cumplimiento del equipo.
      - **Olvidar las combinaciones** (nacimiento + código postal + sexo).
      - **Creer que pseudonimizar es anonimizar.** Un pseudónimo sigue siendo un dato personal: protege, pero no deja de ser sensible.

      ## Cómo se pseudonimiza
      Se calcula un **hash** (una «huella» irreversible) del dato, añadiendo antes una **sal** secreta: `hash("sal" + ssn)`. Dos fichas con el mismo SSN dan la misma huella, así que se pueden unir; pero nadie puede deshacer la huella para obtener el SSN.
    gl: |
      Antes de que ninguén analice a táboa de pacientes hai que decidir, **columna por columna**, que se fai con ela. Esta guía explícache as catro accións, como decidir e que facer con **cada unha das 19 columnas** de `patients`.

      ## Por que importa
      Os datos de saúde están especialmente protexidos pola lei (RXPD). Aínda que aquí sexan ficticios, traballamos **como se fosen reais**. Regra de ouro: **usar só o necesario** e protexer o que identifica a unha persoa.

      ## As catro accións
      | Acción | Que é | Cando se usa | Exemplo |
      |---|---|---|---|
      | **Eliminar** | A columna bórrase do modelo | Non fai falta para nada do proxecto ou identifica directamente | Nome, enderezo |
      | **Pseudonimizar** | Cámbiase o dato por un **código inventado e estable** (un *hash con sal*): a mesma persoa dá sempre o mesmo código | Necesítase para **unir fichas**, pero non para **amosar** quen é | SSN |
      | **Xeneralizar** | O dato faise **menos exacto** (un tramo en vez do valor) | É útil pero demasiado exacto | Data de nacemento → tramo de idade |
      | **Manter** | Queda tal cal | Non identifica e necesítase | Provincia |

      ## Como decidir: 3 preguntas por columna
      1. **Identifica directamente** a unha persoa (nome, número oficial, enderezo exacto)? Entón **non pode quedar en claro**: elimínase… salvo que faga falta para unir fichas, e entón **pseudonimízase**.
      2. **Fai falta** para a análise? Se non, **elimínase**: menos datos, menos risco.
      3. Se fai falta pero é **moi exacta**, **xeneralízase**. Se non é perigosa, **mantense**.

      ## As combinacións tamén identifican
      Algúns datos non identifican por si sós, pero **combinados** si: a **data de nacemento + o código postal + o sexo** abondan para recoñecer a moita xente. Por iso esas columnas **xeneralízanse** aínda que cada unha pareza inofensiva.

      ## As 19 columnas de `patients`
      | Columna | Que contén | Risco | Que facer e por que |
      |---|---|---|---|
      | `patient_id` | Código interno da ficha (aleatorio) | Baixo: non significa nada fóra do hospital | **Manter**: é o que une a ficha cos seus encontros. |
      | `ssn` | Número de identificación da persoa | **Moi alto** (directo) | **Pseudonimizar**: é o único que permite saber que dúas fichas son a mesma persoa, así que se necesita para unir, pero non se amosa. *Non* deixalo en claro e *non* eliminalo. |
      | `drivers` | Carné de conducir | **Moi alto** (directo) | **Eliminar**: non fai falta. |
      | `passport` | Pasaporte | **Moi alto** (directo) | **Eliminar**: non fai falta. |
      | `prefix` | Tratamento (Sr., Sra.) | Baixo | **Eliminar**: non achega nada á análise. |
      | `first_name` | Nome | **Alto** (directo) | **Eliminar**. E non unas fichas por nome: persoas distintas chámanse igual. |
      | `last_name` | Apelidos | **Alto** (directo) | **Eliminar**, igual que o nome. |
      | `marital` | Estado civil | Baixo, pero combínase con outros | **Eliminar**: non fai falta para medir reingresos. |
      | `birthdate` | Data de nacemento exacta | **Alto** combinada con código postal e sexo | **Xeneralizar** a **tramo de idade**: a idade si importa (os maiores reingresan máis), o día exacto non. |
      | `deathdate` | Data de falecemento | Medio | **Manter**: o protocolo esixe excluír os rexistros **posteriores ao falecemento**, e sen esta data non se pode. |
      | `birthplace` | Pobo de nacemento | Medio | **Eliminar** (ou xeneralizar): non se necesita. |
      | `address` | Rúa e número | **Moi alto** (directo) | **Eliminar**. |
      | `city` | Cidade de residencia | Medio: nunha cidade pequena case se sinala a alguén | **Xeneralizar** (a unha área maior) ou eliminar. |
      | `state` | Comunidade autónoma | Baixo | **Manter**: é un nivel moi amplo. |
      | `county` | Provincia | Baixo | **Manter**: nivel amplo e útil para comparar zonas. |
      | `postal_code` | Código postal | **Alto** combinado con nacemento e sexo | **Xeneralizar** (por exemplo, só as primeiras cifras ou a área sanitaria). |
      | `gender` | Sexo | Baixo, pero é unha variable sensible | **Manter**: é útil e permite comprobar que a análise non é inxusta cun sexo concreto. |
      | `lat` | Latitude GPS do domicilio | **Moi alto**: sinala unha vivenda | **Eliminar**. |
      | `lon` | Lonxitude GPS do domicilio | **Moi alto**: sinala unha vivenda | **Eliminar**. |

      ## Erros típicos
      - **Eliminar o SSN.** Parece o máis seguro, pero despois **non poderedes unir as fichas duplicadas** dunha mesma persoa. Hai que pseudonimizalo.
      - **Deixar o SSN (ou o nome, o enderezo, o carné ou o pasaporte) en claro.** É o fallo máis grave: baixa o cumprimento do equipo.
      - **Esquecer as combinacións** (nacemento + código postal + sexo).
      - **Crer que pseudonimizar é anonimizar.** Un pseudónimo segue sendo un dato persoal: protexe, pero non deixa de ser sensible.

      ## Como se pseudonimiza
      Calcúlase un **hash** (unha «pegada» irreversible) do dato, engadindo antes unha **sal** secreta: `hash("sal" + ssn)`. Dúas fichas co mesmo SSN dan a mesma pegada, así que se poden unir; pero ninguén pode desfacer a pegada para obter o SSN.
- id: doc_analyst_requests
  path: docs/peticiones-direccion.md
  title: { es: "Peticiones de la dirección y el protocolo", gl: "Peticións da dirección e o protocolo" }
  body:
    es: |
      Este documento te cuenta **qué quiere la dirección médica** y cómo se traduce en un indicador bien definido.

      ## El encargo
      La directora médica del hospital quiere saber **si los reingresos a 30 días han subido de verdad** y **dónde**. La Comisión de Calidad Asistencial decidirá con lo que le presentéis, así que lo que cuenta es que **se entienda de un vistazo** y que **no engañe**.

      ## Qué es un reingreso
      Un **reingreso** es un ingreso hospitalario de una persona poco después de que le dieran el alta. Es una señal que los hospitales vigilan: puede significar que el alta fue demasiado pronto o que faltó seguimiento. El **Protocolo de Calidad Asistencial v3** (el documento oficial) lo define así:
      1. **Definición:** ingreso que ocurre entre **2 y 30 días naturales** después del alta del episodio anterior.
      2. **Episodios:** dos ingresos de la misma persona separados por **un día o menos** son **un solo episodio** (traslados internos y altas-reingresos administrativos).
      3. **Ámbito:** solo cuentan los **ingresos hospitalarios** (clase `inpatient`); las urgencias y las consultas no son ingresos.
      4. **Exclusiones:** una persona fallecida no puede reingresar; los registros posteriores al fallecimiento se **excluyen** y se comunican al hospital.
      5. **Indicador:** tasa = reingresos a 30 días / altas del periodo.
      Si cambias cualquiera de estas reglas, **cambia el número**: por eso se firma un protocolo.

      ## Qué es una tasa y por qué importa el denominador
      Una **tasa** es una proporción: *cuántos* de *cuántos*. `reingresos / altas`: el **numerador** son los reingresos y el **denominador** son las altas del periodo.
      - Una cifra **sin denominador engaña**: «100 reingresos» no dice nada si no sabes si hubo 200 altas o 20 000.
      - El denominador correcto es el de las **personas que podían reingresar**: las **altas** del periodo. Dividir entre «pacientes del hospital» o no dividir (contar solo reingresos) cambia el significado.

      ## El problema de los centros pequeños
      Un centro con **muy pocos casos** puede tener una tasa enorme por pura casualidad: 3 ingresos y 1 reingreso = 33 %; 3 ingresos y 3 reingresos = **100 %**. Compararlo con un hospital grande es injusto. Hay tres maneras de tratarlo:
      | Opción | Ventaja | Inconveniente |
      |---|---|---|
      | Mostrarla como las demás | Sencilla | Engaña: parece el peor centro |
      | Ocultarla sin decir nada | Limpia | **Oculta información** y genera desconfianza |
      | Fijar un **mínimo de altas** para publicar la tasa y **avisar** de que hay pocos casos | Honesta y comparable | Hay que elegir bien el mínimo |
      Un mínimo bajo (10) sigue dejando pasar centros inestables; uno enorme (1 000) deja fuera a casi todos. Lo habitual es un mínimo del orden de unas decenas de casos.

      ## Lo que no le gusta a la Comisión
      Cifras sin contexto, gráficos con el eje recortado y tasas de centros con muy pocos casos.
    gl: |
      Este documento cóntache **que quere a dirección médica** e como se traduce nun indicador ben definido.

      ## O encargo
      A directora médica do hospital quere saber **se os reingresos a 30 días subiron de verdade** e **onde**. A Comisión de Calidade Asistencial decidirá co que lle presentedes, así que o que conta é que **se entenda dun vistazo** e que **non engane**.

      ## Que é un reingreso
      Un **reingreso** é un ingreso hospitalario dunha persoa pouco despois de que lle dean a alta. É un sinal que os hospitais vixían: pode significar que a alta foi demasiado pronto ou que faltou seguimento. O **Protocolo de Calidade Asistencial v3** (o documento oficial) defíneo así:
      1. **Definición:** ingreso que ocorre entre **2 e 30 días naturais** despois da alta do episodio anterior.
      2. **Episodios:** dous ingresos da mesma persoa separados por **un día ou menos** son **un só episodio** (traslados internos e altas-reingresos administrativos).
      3. **Ámbito:** só contan os **ingresos hospitalarios** (clase `inpatient`); as urxencias e as consultas non son ingresos.
      4. **Exclusións:** unha persoa falecida non pode reingresar; os rexistros posteriores ao falecemento **exclúense** e comunícanse ao hospital.
      5. **Indicador:** taxa = reingresos a 30 días / altas do período.
      Se cambias calquera destas regras, **cambia o número**: por iso se asina un protocolo.

      ## Que é unha taxa e por que importa o denominador
      Unha **taxa** é unha proporción: *cantos* de *cantos*. `reingresos / altas`: o **numerador** son os reingresos e o **denominador** son as altas do período.
      - Unha cifra **sen denominador engana**: «100 reingresos» non di nada se non sabes se houbo 200 altas ou 20 000.
      - O denominador correcto é o das **persoas que podían reingresar**: as **altas** do período. Dividir entre «pacientes do hospital» ou non dividir (contar só reingresos) cambia o significado.

      ## O problema dos centros pequenos
      Un centro con **moi poucos casos** pode ter unha taxa enorme por pura casualidade: 3 ingresos e 1 reingreso = 33 %; 3 ingresos e 3 reingresos = **100 %**. Compralo cun hospital grande é inxusto. Hai tres maneiras de tratalo:
      | Opción | Vantaxe | Inconveniente |
      |---|---|---|
      | Amosala como as demais | Sinxela | Engana: parece o peor centro |
      | Agochala sen dicir nada | Limpa | **Oculta información** e xera desconfianza |
      | Fixar un **mínimo de altas** para publicar a taxa e **avisar** de que hai poucos casos | Honesta e comparable | Hai que elixir ben o mínimo |
      Un mínimo baixo (10) segue deixando pasar centros inestables; un enorme (1 000) deixa fóra a case todos. O habitual é un mínimo da orde de unhas decenas de casos.

      ## O que non lle gusta á Comisión
      Cifras sen contexto, gráficos co eixe recortado e taxas de centros con moi poucos casos.
- id: doc_analyst_style
  path: docs/estilo-dashboard.md
  title: { es: "Guía de estilo del cuadro de mando", gl: "Guía de estilo do cadro de mando" }
  body:
    es: |
      Un **dashboard** (cuadro de mando) es una pantalla con pocos gráficos que ayudan a **decidir**. Esta guía recoge las reglas de la Comisión y por qué existen. El «Crítico de visualización» las comprobará una por una.

      ## Cuántos gráficos
      **Entre 3 y 4.** Cada gráfico debe **responder a una pregunta** de la Comisión (¿qué centros reingresan más? ¿cómo evoluciona mes a mes? ¿qué grupos de edad?). Más gráficos = más ruido.

      ## Las reglas, una por una
      | Regla | Qué significa | Por qué |
      |---|---|---|
      | **Eje en cero** (barras) | La barra empieza en 0 | Si el eje empieza en 5 %, una barra de 6 % parece el triple de una de 5,5 %: **exagera** la diferencia |
      | **Número de casos visible** | Junto a cada tasa, el número de altas (n) | Una tasa sin denominador engaña (ver «Peticiones de la dirección») |
      | **Mínimo de altas** | Se ocultan o avisan los centros con menos de 30 altas | Los centros pequeños dan tasas extremas por azar |
      | **Ordenar de mayor a menor** | En barras por centro, de la más alta a la más baja | Se lee de un vistazo quién destaca |
      | **Título = conclusión** | Una frase que diga **qué se ve**, no solo qué es | «Un centro supera con claridad al resto…» informa; «Reingresos por centro» solo etiqueta |
      | **Máximo dos colores de énfasis** | Un color base y otro para resaltar; que se distingan con daltonismo | El arcoíris distrae y no todo el mundo ve todos los colores |
      | **Sin doble eje** | No mezclar dos escalas en un gráfico | Confunde: parece que dos cosas están relacionadas cuando solo comparten el dibujo |
      | **Sin 3D** | Barras planas | El 3D deforma las barras y dificulta compararlas |

      ## Cómo escribir un buen título
      Un título que dice la conclusión suele tener **6 palabras o más** y un **verbo de comparación o una cifra**: *supera, concentra, sube, baja, mayor, menor, más, menos…*
      - Malo: «Reingresos por centro».
      - Bueno: «Un centro supera con claridad al resto en reingresos a 30 días».
      Escribe lo que **de verdad** se ve en el gráfico: no inventes la conclusión antes de mirarlo.

      ## Elegir el tipo de gráfico
      - **Barras por centro / por grupo de edad:** para **comparar categorías**.
      - **Línea mensual:** para ver **cómo cambia** algo con el tiempo.
      - **Tabla:** cuando importan los números exactos.
      - **Indicador único (KPI):** una cifra grande con su contexto.

      ## Lista de comprobación antes de entregar
      - ¿3 o 4 gráficos, cada uno con su pregunta?
      - ¿Eje en cero, n visible y mínimo de altas en cada gráfico?
      - ¿Orden de mayor a menor en las barras por centro?
      - ¿Máximo dos colores, sin 3D ni doble eje?
      - ¿Cada título dice una conclusión?
    gl: |
      Un **dashboard** (cadro de mando) é unha pantalla con poucos gráficos que axudan a **decidir**. Esta guía recolle as regras da Comisión e por que existen. O «Crítico de visualización» comprobaraas unha por unha.

      ## Cantos gráficos
      **Entre 3 e 4.** Cada gráfico debe **responder a unha pregunta** da Comisión (que centros reingresan máis? como evoluciona mes a mes? que grupos de idade?). Máis gráficos = máis ruído.

      ## As regras, unha por unha
      | Regra | Que significa | Por que |
      |---|---|---|
      | **Eixe en cero** (barras) | A barra empeza en 0 | Se o eixe empeza en 5 %, unha barra de 6 % parece o triplo dunha de 5,5 %: **esaxera** a diferenza |
      | **Número de casos visible** | Xunto a cada taxa, o número de altas (n) | Unha taxa sen denominador engana (ver «Peticións da dirección») |
      | **Mínimo de altas** | Agóchanse ou avísase dos centros con menos de 30 altas | Os centros pequenos dan taxas extremas por azar |
      | **Ordenar de maior a menor** | En barras por centro, da máis alta á máis baixa | Lese dun vistazo quen destaca |
      | **Título = conclusión** | Unha frase que diga **que se ve**, non só que é | «Un centro supera con claridade ao resto…» informa; «Reingresos por centro» só etiqueta |
      | **Máximo dúas cores de énfase** | Unha cor base e outra para resaltar; que se distingan con daltonismo | O arco da vella distrae e non todo o mundo ve todas as cores |
      | **Sen dobre eixe** | Non mesturar dúas escalas nun gráfico | Confunde: parece que dúas cousas están relacionadas cando só comparten o debuxo |
      | **Sen 3D** | Barras planas | O 3D deforma as barras e dificulta comparalas |

      ## Como escribir un bo título
      Un título que di a conclusión adoita ter **6 palabras ou máis** e un **verbo de comparación ou unha cifra**: *supera, concentra, sobe, baixa, maior, menor, máis, menos…*
      - Malo: «Reingresos por centro».
      - Bo: «Un centro supera con claridade ao resto en reingresos a 30 días».
      Escribe o que **de verdade** se ve no gráfico: non inventes a conclusión antes de miralo.

      ## Elixir o tipo de gráfico
      - **Barras por centro / por grupo de idade:** para **comparar categorías**.
      - **Liña mensual:** para ver **como cambia** algo co tempo.
      - **Táboa:** cando importan os números exactos.
      - **Indicador único (KPI):** unha cifra grande co seu contexto.

      ## Lista de comprobación antes de entregar
      - 3 ou 4 gráficos, cada un coa súa pregunta?
      - Eixe en cero, n visible e mínimo de altas en cada gráfico?
      - Orde de maior a menor nas barras por centro?
      - Máximo dúas cores, sen 3D nin dobre eixe?
      - Cada título di unha conclusión?
- id: doc_ds_ai
  path: docs/verificar-ia.md
  title: { es: "Cómo se verifica lo que dice una IA", gl: "Como se verifica o que di unha IA" }
  body:
    es: |
      Una IA puede decir cifras **falsas con total seguridad**. Quien trabaja con IA tiene que saber **comprobar** sus resultados con los datos, igual que se revisa el trabajo de un compañero nuevo. Aquí tienes el método.

      ## El método en 4 pasos
      1. **Traduce** la afirmación a una pregunta sobre los datos. «Hay 9 centros» → *¿cuántos centros distintos aparecen en los encuentros?*
      2. **Haz la pregunta** a los datos (en el Laboratorio de preguntas).
      3. **Compara** el resultado con lo que dice la IA.
      4. Si **no coinciden**, la afirmación es **falsa**. Si coinciden, es verdadera: **no la marques**.

      ## Las preguntas básicas que se pueden hacer a una tabla
      | Quieres saber… | Pregunta en el Laboratorio | Para qué sirve |
      |---|---|---|
      | Cuántas filas hay | «Contar cuántas filas hay» | Tamaño de una tabla |
      | Cuántos valores distintos hay | «Contar valores **DISTINTOS** de una columna» | Contar personas o centros sin repetir |
      | Cuántos huecos hay | Condición «**está vacía**» sobre la columna | Detectar datos que faltan (nulos) |
      | Entre qué valores se mueve | «Valor más pequeño y más grande» | Rangos de fechas o de edades |
      | Cuántas veces sale cada valor | «Ver qué valores hay y cuántas veces» | Categorías (tipos de encuentro…) |
      | Si algo no tiene pareja en otra tabla | «Contar filas cuyo valor **NO aparece** en otra tabla» | Encuentros sin paciente |
      Con las **condiciones** (hasta 3) puedes restringir la pregunta: «solo los de tipo `inpatient`» y «con `stop_ts` vacía» a la vez.

      ## Trampas que debes vigilar
      - **Filas no es lo mismo que personas o visitas.** Una tabla puede tener 9 015 *filas* y menos *personas distintas* si hay fichas duplicadas. Para contar «cosas reales» usa **valores distintos** de la clave.
      - **Repetidos por los reenvíos.** Si un fichero se envió dos veces, contar filas cuenta dos veces.
      - **Vacío ≠ cero.** «Ningún ingreso sin fecha de alta» se comprueba contando los **vacíos**, no mirando por encima.
      - **Los rangos de fechas** pueden mezclar formatos distintos: ten cuidado al interpretar el mínimo y el máximo.
      - **Una cifra casi igual no es igual.** 9 003 y 9 015 son números parecidos y, sin embargo, hacen falsa la afirmación.

      ## Por qué marcar solo las falsas
      Cada marca equivocada **resta puntos**. Marcar «por si acaso» es lo contrario de verificar: **comprueba cada afirmación con una consulta** y marca solo aquellas en las que has visto que el dato real es otro.

      ## Y recuerda
      Una IA no «miente»: genera texto que **suena verosímil**. Por eso su salida es una **hipótesis** que hay que contrastar con datos antes de usarla.
    gl: |
      Unha IA pode dicir cifras **falsas con total seguridade**. Quen traballa con IA ten que saber **comprobar** os seus resultados cos datos, igual que se revisa o traballo dun compañeiro novo. Aquí tes o método.

      ## O método en 4 pasos
      1. **Traduce** a afirmación a unha pregunta sobre os datos. «Hai 9 centros» → *cantos centros distintos aparecen nos encontros?*
      2. **Fai a pregunta** aos datos (no Laboratorio de preguntas).
      3. **Compara** o resultado co que di a IA.
      4. Se **non coinciden**, a afirmación é **falsa**. Se coinciden, é verdadeira: **non a marques**.

      ## As preguntas básicas que se poden facer a unha táboa
      | Queres saber… | Pregunta no Laboratorio | Para que serve |
      |---|---|---|
      | Cantas filas hai | «Contar cantas filas hai» | Tamaño dunha táboa |
      | Cantos valores distintos hai | «Contar valores **DISTINTOS** dunha columna» | Contar persoas ou centros sen repetir |
      | Cantos ocos hai | Condición «**está baleira**» sobre a columna | Detectar datos que faltan (nulos) |
      | Entre que valores se move | «Valor máis pequeno e máis grande» | Rangos de datas ou de idades |
      | Cantas veces sae cada valor | «Ver que valores hai e cantas veces» | Categorías (tipos de encontro…) |
      | Se algo non ten parella noutra táboa | «Contar filas cuxo valor **NON aparece** noutra táboa» | Encontros sen paciente |
      Coas **condicións** (ata 3) podes restrinxir a pregunta: «só os de tipo `inpatient`» e «con `stop_ts` baleira» á vez.

      ## Trampas que debes vixiar
      - **Filas non é o mesmo que persoas ou visitas.** Unha táboa pode ter 9 015 *filas* e menos *persoas distintas* se hai fichas duplicadas. Para contar «cousas reais» usa **valores distintos** da clave.
      - **Repetidos polos reenvíos.** Se un ficheiro se enviou dúas veces, contar filas conta dúas veces.
      - **Baleiro ≠ cero.** «Ningún ingreso sen data de alta» comprobase contando os **baleiros**, non mirando por riba.
      - **Os rangos de datas** poden mesturar formatos distintos: ten coidado ao interpretar o mínimo e o máximo.
      - **Unha cifra case igual non é igual.** 9 003 e 9 015 son números parecidos e, con todo, fan falsa a afirmación.

      ## Por que marcar só as falsas
      Cada marca equivocada **resta puntos**. Marcar «por se acaso» é o contrario de verificar: **comproba cada afirmación cunha consulta** e marca só aquelas nas que viches que o dato real é outro.

      ## E lembra
      Unha IA non «minte»: xera texto que **soa verosímil**. Por iso a súa saída é unha **hipótese** que hai que contrastar con datos antes de usala.
- id: doc_ds_analysis
  path: docs/metodo-investigacion.md
  title: { es: "Método para investigar datos raros", gl: "Método para investigar datos raros" }
  body:
    es: |
      Un dato raro es una **pista**, no un error automático. Este método te ayuda a entender **qué ha pasado** antes de decidir qué hacer.

      ## Las 5 preguntas del detective
      1. **¿Cuántos son?** ¿Un puñado o miles?
      2. **¿En qué centros ocurre?** ¿En todos o solo en uno?
      3. **¿Desde cuándo?** ¿Siempre, o a partir de una fecha?
      4. **¿Le pasa a todos o a un grupo?** (por ejemplo, solo a personas fallecidas, solo a un tipo de encuentro).
      5. **¿Qué otra cosa cambió a la vez?** (una migración informática, un turno, un registro).

      ## Tres tipos de causa y cómo reconocerlos
      | Causa | Cómo se ve en los datos | Ejemplo de la vida real |
      |---|---|---|
      | **Error de captura** (alguien se equivoca al teclear) | Casos **sueltos**, repartidos al azar entre centros y fechas; sin patrón | Una alta escrita con fecha anterior al ingreso |
      | **Fallo de sistema o migración** | Se **concentra en un centro y a partir de una fecha**; suele ser un número grande de registros parecidos | Un cambio de sistema que duplica marcas de alta |
      | **Registro tardío** (el dato llega con retraso) | Relacionado con **algo que se registra más tarde que lo demás**; los registros son *posteriores* a un hecho que debería haberlos frenado | El registro de defunciones tarda semanas, y hay visitas anotadas después de que la persona falleciera |
      Un error de captura se reparte **al azar**; un fallo de sistema tiene **fecha y lugar**; un registro tardío tiene **un hecho que llega tarde**.

      ## Un valor extremo no siempre es un error
      Antes de tocar nada, **investiga**: ¿tiene explicación? Una estancia de 40 días puede ser real. Solo después de entender la causa se decide qué hacer.

      ## Qué hacer: cuatro tratamientos
      | Tratamiento | Cuándo | Cuidado |
      |---|---|---|
      | **Corregir con una regla** | La causa es clara y la corrección es **mecánica y segura** | No inventes: si dudas de un **dato clínico**, no lo «arregles» |
      | **Excluir y documentar** | El registro es imposible o inútil (p. ej. una estancia negativa) | Apunta cuántos y por qué: la Comisión lo preguntará |
      | **Excluir y escalar al hospital** | La causa está **fuera de vuestro control** y el hospital debe corregirla en origen | Comunícalo con datos concretos |
      | **Ya cubierto por otra regla: documentar** | Otra regla del modelo ya lo resuelve (p. ej. la fusión de episodios) | No lo cuentes dos veces |
      **Regla de oro:** si dudas de un dato clínico, **no lo inventes**.

      ## Cómo documentar
      Para cada grupo de anomalías, anota: *cuántos registros, en qué centros, desde cuándo, cuál es la causa probable y qué decisión se tomó*. Es lo que pedirá la Comisión.

      ## Entrevistar a las personas que conocen el negocio
      Quien trabaja cada día con los datos conoce sus manías. Para que te cuenten algo útil:
      - Sé **concreto**: di el **centro** y el **momento** que te interesan, en vez de preguntar «¿qué pasa?».
      - Sé **amable**: interésate por su trabajo («¿cómo es registrar las altas de madrugada?»). Quien se siente escuchado cuenta más.
      - Tienes un **número limitado de preguntas**: no las malgastes.

      ## El identificador de un encuentro
      Recuerda: un encuentro se identifica por `encounter_id`. Es la clave para buscar «el mismo registro» en distintos ficheros.
    gl: |
      Un dato raro é unha **pista**, non un erro automático. Este método axúdate a entender **que pasou** antes de decidir que facer.

      ## As 5 preguntas do detective
      1. **Cantos son?** Un puñado ou miles?
      2. **En que centros ocorre?** En todos ou só nun?
      3. **Desde cando?** Sempre, ou a partir dunha data?
      4. **Pásalle a todos ou a un grupo?** (por exemplo, só a persoas falecidas, só a un tipo de encontro).
      5. **Que outra cousa cambiou á vez?** (unha migración informática, un turno, un rexistro).

      ## Tres tipos de causa e como recoñecelos
      | Causa | Como se ve nos datos | Exemplo da vida real |
      |---|---|---|
      | **Erro de captura** (alguén equivócase ao teclear) | Casos **soltos**, repartidos ao azar entre centros e datas; sen patrón | Unha alta escrita con data anterior ao ingreso |
      | **Fallo de sistema ou migración** | Concéntrase **nun centro e a partir dunha data**; adoita ser un número grande de rexistros parecidos | Un cambio de sistema que duplica marcas de alta |
      | **Rexistro tardío** (o dato chega con atraso) | Relacionado con **algo que se rexistra máis tarde ca o resto**; os rexistros son *posteriores* a un feito que debería telos frenado | O rexistro de defuncións tarda semanas, e hai visitas anotadas despois de que a persoa falecese |
      Un erro de captura repártese **ao azar**; un fallo de sistema ten **data e lugar**; un rexistro tardío ten **un feito que chega tarde**.

      ## Un valor extremo non sempre é un erro
      Antes de tocar nada, **investiga**: ten explicación? Unha estadía de 40 días pode ser real. Só despois de entender a causa se decide que facer.

      ## Que facer: catro tratamentos
      | Tratamento | Cando | Coidado |
      |---|---|---|
      | **Corrixir cunha regra** | A causa é clara e a corrección é **mecánica e segura** | Non inventes: se dubidas dun **dato clínico**, non o «arranxes» |
      | **Excluír e documentar** | O rexistro é imposible ou inútil (p. ex. unha estadía negativa) | Apunta cantos e por que: a Comisión preguntarao |
      | **Excluír e escalar ao hospital** | A causa está **fóra do voso control** e o hospital debe corrixila na orixe | Comunícao con datos concretos |
      | **Xa cuberto por outra regra: documentar** | Outra regra do modelo xa o resolve (p. ex. a fusión de episodios) | Non o contes dúas veces |
      **Regra de ouro:** se dubidas dun dato clínico, **non o inventes**.

      ## Como documentar
      Para cada grupo de anomalías, anota: *cantos rexistros, en que centros, desde cando, cal é a causa probable e que decisión se tomou*. É o que pedirá a Comisión.

      ## Entrevistar as persoas que coñecen o negocio
      Quen traballa cada día cos datos coñece as súas manías. Para que che contén algo útil:
      - Sé **concreto**: di o **centro** e o **momento** que che interesan, en vez de preguntar «que pasa?».
      - Sé **amable**: interésate polo seu traballo («como é rexistrar as altas de madrugada?»). Quen se sente escoitado conta máis.
      - Tes un **número limitado de preguntas**: non as malgastes.

      ## O identificador dun encontro
      Lembra: un encontro identifícase por `encounter_id`. É a clave para buscar «o mesmo rexistro» en distintos ficheiros.
- id: doc_ds_bias
  path: docs/sesgos.md
  title: { es: "Variables sensibles y sesgos", gl: "Variables sensibles e sesgos" }
  body:
    es: |
      Un **sesgo** es una tendencia injusta: que el resultado de un análisis o de un modelo funcione peor, o trate peor, a un grupo de personas. Este documento te explica de dónde vienen y cómo reducirlos.

      ## Variables sensibles
      Hay datos que, usados sin cuidado, pueden producir resultados **injustos**:
      - **Sexo / género.** Si un modelo aprende de datos donde un sexo está poco representado, funcionará peor con él.
      - **Edad exacta.** Puede ser útil (los mayores reingresan más), pero la edad exacta es demasiado precisa: es mejor trabajar con **tramos**.
      - **Zona donde vive.** Se relaciona con renta, acceso al hospital y otras desigualdades. Un modelo podría castigar a un barrio por razones que no controla.
      - **Estado civil, lugar de nacimiento…** Rara vez justifican una decisión clínica.

      ## Por qué es un problema
      Un modelo **aprende de los datos que le damos, con sus errores incluidos**. Si los datos reflejan una desigualdad (por ejemplo, algunos grupos van menos al hospital y por eso aparecen menos), el modelo la **repite y la amplifica**. Y lo hace con apariencia de objetividad: «lo dice el ordenador».

      ## Cómo se reduce el riesgo
      1. **Usar solo lo necesario.** Cuantos menos datos identificativos se mantengan, menos riesgo. Por eso en la sala de privacidad se eliminan o generalizan muchas columnas.
      2. **Generalizar** (tramos de edad, áreas amplias) en lugar de valores exactos.
      3. **Mantener una variable sensible solo si hace falta para vigilar la equidad.** Por ejemplo, el sexo se puede conservar precisamente para **comprobar** que el modelo funciona igual de bien con todos los grupos, no para usarlo en la decisión.
      4. **Medir por grupos.** No basta con un resultado global: calcula las métricas por separado para cada grupo. Si un grupo sale muy peor, hay un problema.
      5. **Documentar** qué datos se han usado, cuáles se han descartado y por qué.

      ## Una pregunta para hacerte siempre
      *«¿Quién podría salir perjudicado por esta decisión, y cómo lo sabría yo?»*
    gl: |
      Un **sesgo** é unha tendencia inxusta: que o resultado dunha análise ou dun modelo funcione peor, ou trate peor, a un grupo de persoas. Este documento explícache de onde veñen e como reducilos.

      ## Variables sensibles
      Hai datos que, usados sen coidado, poden producir resultados **inxustos**:
      - **Sexo / xénero.** Se un modelo aprende de datos onde un sexo está pouco representado, funcionará peor con el.
      - **Idade exacta.** Pode ser útil (os maiores reingresan máis), pero a idade exacta é demasiado precisa: é mellor traballar con **tramos**.
      - **Zona onde vive.** Relaciónase con renda, acceso ao hospital e outras desigualdades. Un modelo podería castigar a un barrio por razóns que non controla.
      - **Estado civil, lugar de nacemento…** Raramente xustifican unha decisión clínica.

      ## Por que é un problema
      Un modelo **aprende dos datos que lle damos, cos seus erros incluídos**. Se os datos reflicten unha desigualdade (por exemplo, algúns grupos van menos ao hospital e por iso aparecen menos), o modelo **repíteo e amplíao**. E faino con aparencia de obxectividade: «dío o ordenador».

      ## Como se reduce o risco
      1. **Usar só o necesario.** Cantos menos datos identificativos se manteñan, menos risco. Por iso na sala de privacidade elimínanse ou xeneralízanse moitas columnas.
      2. **Xeneralizar** (tramos de idade, áreas amplas) en vez de valores exactos.
      3. **Manter unha variable sensible só se fai falta para vixiar a equidade.** Por exemplo, o sexo pódese conservar precisamente para **comprobar** que o modelo funciona igual de ben con todos os grupos, non para usalo na decisión.
      4. **Medir por grupos.** Non abonda cun resultado global: calcula as métricas por separado para cada grupo. Se un grupo sae moi peor, hai un problema.
      5. **Documentar** que datos se usaron, cales se descartaron e por que.

      ## Unha pregunta para facerte sempre
      *«Quen podería saír prexudicado por esta decisión, e como o sabería eu?»*
- id: doc_ds_ml
  path: docs/prediccion.md
  title: { es: "Predecir sin hacer trampa", gl: "Predicir sen facer trampa" }
  body:
    es: |
      Un **modelo predictivo** aprende de casos pasados para estimar qué pasará con casos nuevos. Aquí, por ejemplo: *¿volverá a ingresar este paciente en 30 días?* Este documento te explica cómo construir uno **sin engañarte**.

      ## Cómo aprende un modelo
      1. Se le dan **muchos casos pasados** con sus datos (edad, tipo de ingreso, diagnósticos…) y el resultado **ya conocido** (¿reingresó?).
      2. El modelo busca **patrones** que relacionan los datos con el resultado.
      3. Después se le enseñan **casos que nunca ha visto** y se comprueba si acierta. Por eso los datos se dividen en dos grupos: de **entrenamiento** (para aprender) y de **prueba** (para evaluar, sin que el modelo los haya visto).

      ## La trampa principal: la fuga de datos
      Para predecir un reingreso **solo vale usar lo que se sabe en el momento del alta**. Si una variable contiene información **del futuro**, el modelo parece perfecto pero **no sirve** en la vida real: eso se llama **fuga de datos** (*data leakage*).
      - Ejemplo de fuga: usar «**días hasta el siguiente ingreso**» para predecir si habrá un siguiente ingreso. Si el valor existe, ¡ya hubo reingreso!
      - Otro ejemplo: usar una variable que se rellena **después** del alta.
      **Señal de alarma:** si un resultado es **demasiado bueno** (casi perfecto), desconfía y busca la fuga.

      ## Cómo se mide un modelo
      Un modelo que dice «nadie reingresará» acierta casi siempre (porque la mayoría no reingresa) y **no sirve de nada**. Por eso se usan varias métricas:
      | Métrica | Qué responde |
      |---|---|
      | **Sensibilidad** | De los casos que **sí** reingresaron, ¿cuántos detectó el modelo? |
      | **Falsas alarmas** | De los pacientes que el modelo marcó como riesgo, ¿cuántos **no** reingresaron? |
      | **AUC** | Un resumen entre 0,5 (como tirar una moneda) y 1 (perfecto) de lo bien que **ordena** a los pacientes de menos a más riesgo |

      ## El umbral: un equilibrio
      El modelo da una **probabilidad** de reingreso. Tú decides desde qué probabilidad se activa un aviso (el **umbral**):
      - Umbral **bajo** → detectas más casos reales, pero hay **más falsas alarmas**.
      - Umbral **alto** → menos falsas alarmas, pero **se escapan** casos reales.
      En un hospital, una falsa alarma cuesta tiempo; un caso no detectado puede costar salud. La decisión no es solo técnica.

      ## Equidad
      Mide el modelo **por grupos** (sexo, tramo de edad…). Un buen resultado global puede esconder que funciona mal con un grupo concreto. Mira el documento «Variables sensibles y sesgos».
    gl: |
      Un **modelo predictivo** aprende de casos pasados para estimar que pasará con casos novos. Aquí, por exemplo: *volverá ingresar este paciente en 30 días?* Este documento explícache como construír un **sen enganarte**.

      ## Como aprende un modelo
      1. Dánselle **moitos casos pasados** cos seus datos (idade, tipo de ingreso, diagnósticos…) e o resultado **xa coñecido** (reingresou?).
      2. O modelo busca **patróns** que relacionan os datos co resultado.
      3. Despois ensínanselle **casos que nunca viu** e comprobase se acerta. Por iso os datos divídense en dous grupos: de **adestramento** (para aprender) e de **proba** (para avaliar, sen que o modelo os vise).

      ## A trampa principal: a fuga de datos
      Para predicir un reingreso **só vale usar o que se sabe no momento da alta**. Se unha variable contén información **do futuro**, o modelo parece perfecto pero **non serve** na vida real: iso chámase **fuga de datos** (*data leakage*).
      - Exemplo de fuga: usar «**días ata o seguinte ingreso**» para predicir se haberá un seguinte ingreso. Se o valor existe, xa houbo reingreso!
      - Outro exemplo: usar unha variable que se enche **despois** da alta.
      **Sinal de alarma:** se un resultado é **demasiado bo** (case perfecto), desconfía e busca a fuga.

      ## Como se mide un modelo
      Un modelo que di «ninguén reingresará» acerta case sempre (porque a maioría non reingresa) e **non serve de nada**. Por iso úsanse varias métricas:
      | Métrica | Que responde |
      |---|---|
      | **Sensibilidade** | Dos casos que **si** reingresaron, cantos detectou o modelo? |
      | **Falsas alarmas** | Dos pacientes que o modelo marcou como risco, cantos **non** reingresaron? |
      | **AUC** | Un resumo entre 0,5 (como tirar unha moeda) e 1 (perfecto) de como de ben **ordena** os pacientes de menos a máis risco |

      ## O limiar: un equilibrio
      O modelo dá unha **probabilidade** de reingreso. Ti decides desde que probabilidade se activa un aviso (o **limiar**):
      - Limiar **baixo** → detectas máis casos reais, pero hai **máis falsas alarmas**.
      - Limiar **alto** → menos falsas alarmas, pero **escápanse** casos reais.
      Nun hospital, unha falsa alarma custa tempo; un caso non detectado pode custar saúde. A decisión non é só técnica.

      ## Equidade
      Mide o modelo **por grupos** (sexo, tramo de idade…). Un bo resultado global pode agochar que funciona mal cun grupo concreto. Mira o documento «Variables sensibles e sesgos».
