id: r6a_entrenar
room: R6
type: model
title: { es: "Entrenar el modelo", gl: "Adestrar o modelo" }
docs_needed: [doc_ds_ml, doc_ds_bias]
story:
  es: "La enfermería quiere saber, ANTES del alta, quién volverá a ingresar. Elegid con qué datos aprende el modelo y entrenadlo. Ojo: solo vale lo que se sabe en el momento del alta."
  gl: "A enfermaría quere saber, ANTES da alta, quen volverá ingresar. Elixide con que datos aprende o modelo e adestrádeo. Ollo: só vale o que se sabe no momento da alta."
tools: [ml_train]
answer_hint:
  es: "Marcad variables, pulsad «Entrenar» y, cuando el modelo sea bueno y honesto, «Entregar modelo»."
  gl: "Marcade variables, premede «Adestrar» e, cando o modelo sexa bo e honesto, «Entregar modelo»."
validator: { type: ml_train, min_auc: 0.65, min_features: 2 }
points: 120
time_target_min: 7
hints:
  - { es: "Solo vale lo que el hospital SABE el día del alta. Si una variable mira al futuro, el modelo sale casi perfecto (AUC cerca de 1): eso es trampa, no un buen modelo.", gl: "Só vale o que o hospital SABE o día da alta. Se unha variable mira ao futuro, o modelo sae case perfecto (AUC preto de 1): iso é trampa, non un bo modelo." }
  - { es: "«Días hasta el siguiente ingreso» es el futuro: quitadla. Las otras seis (edad, nº de condiciones, duración de la estancia, ingresos previos, centro y sexo) sí se conocen al alta.", gl: "«Días ata o seguinte ingreso» é o futuro: quitádea. As outras seis (idade, nº de condicións, duración da estadía, ingresos previos, centro e sexo) si se coñecen na alta." }
  - { es: "Marcad esas seis, entrenad y comprobad que el AUC ronda 0,70 (realista). Entonces, «Entregar modelo».", gl: "Marcade esas seis, adestrade e comprobade que o AUC anda polo 0,70 (realista). Entón, «Entregar modelo»." }
solution:
  es: "Marcad las 6 variables que se conocen al alta: edad, nº de condiciones, duración de la estancia, ingresos previos, centro y sexo. NO marquéis «Días hasta el siguiente ingreso» (cuenta el futuro). Entrenad (AUC ≈ 0,70) y pulsad «Entregar modelo»."
  gl: "Marcade as 6 variables que se coñecen á alta: idade, nº de condicións, duración da estadía, ingresos previos, centro e sexo. NON marquedes «Días ata o seguinte ingreso» (conta o futuro). Adestrade (AUC ≈ 0,70) e premede «Entregar modelo»."
