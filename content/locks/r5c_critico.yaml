id: r5c_critico
room: R5
type: verify_ai
title: { es: "Revisión del crítico", gl: "Revisión do crítico" }
docs_needed: [doc_analyst_style]
story:
  es: "El crítico (una IA) revisa vuestros gráficos. Lo rojo engaña a quien lo mira: hay que arreglarlo para entregar. Lo amarillo es mejorable: podéis entregar igual, pero ganaréis menos confianza."
  gl: "O crítico (unha IA) revisa os vosos gráficos. O vermello engana a quen o mira: hai que arranxalo para entregar. O amarelo é mellorable: podedes entregar igual, pero gañaredes menos confianza."
tools: [dashboard_builder, critic_panel]
validator: { type: chart_rules, mode: review, max_findings: 0 }
points: 110
time_target_min: 8
hints:
  - { es: "Leed cada aviso rojo: dice qué cambiar. Los típicos: número de reingresos en vez de tasa (en «Qué dato» elegid la tasa), y línea, área, tarta o donut para algo que no es tiempo (cambiadlo a barras).", gl: "Lede cada aviso vermello: di que cambiar. Os típicos: número de reingresos no canto de taxa (en «Que dato» elixide a taxa), e liña, área, torta ou donut para algo que non é tempo (cambiádeo a barras)." }
  - { es: "En el gráfico de centros marcad «Aplicar vuestro mínimo de altas»: si no, sale un centro con 3 casos y un 100 %. Con eso desaparece el último rojo típico y ya podéis entregar.", gl: "No gráfico de centros marcade «Aplicar o voso mínimo de altas»: se non, sae un centro con 3 casos e un 100 %. Con iso desaparece o último vermello típico e xa podedes entregar." }
  - { es: "Para lo amarillo (más confianza): «Mostrar n», orden «De mayor a menor» y colores «Uno + énfasis». Si dos gráficos enseñan lo mismo, cambiad uno a otra pregunta (por edad o por mes).", gl: "Para o amarelo (máis confianza): «Mostrar n», orde «De maior a menor» e cores «Un + énfase». Se dous gráficos ensinan o mesmo, cambiade un a outra pregunta (por idade ou por mes)." }
solution:
  es: "En cada gráfico usad la tasa (no el número) y barras salvo para meses o años; en el de centros marcad «Aplicar vuestro mínimo de altas», orden «De mayor a menor», «Mostrar n» y colores «Uno + énfasis». Con nada en rojo, entregad."
  gl: "En cada gráfico usade a taxa (non o número) e barras agás para meses ou anos; no de centros marcade «Aplicar o voso mínimo de altas», orde «De maior a menor», «Amosar n» e cores «Un + énfase». Sen nada en vermello, entregade."
