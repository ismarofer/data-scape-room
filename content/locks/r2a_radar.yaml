id: r2a_radar
room: R1
type: decision
title: { es: "Radar RGPD", gl: "Radar RGPD" }
docs_needed: [doc_de_privacy, doc_ds_bias]
story:
  es: "Antes de usar los datos de pacientes hay que protegerlos: lo exige la ley (el RGPD). Decidid qué hacer con cada columna: eliminarla, pseudonimizarla (cambiarla por un código), mantenerla o generalizarla (hacerla menos exacta)."
  gl: "Antes de usar os datos de pacientes hai que protexelos: esíxeo a lei (o RXPD). Decidide que facer con cada columna: eliminala, pseudonimizala (cambiala por un código), mantela ou xeneralizala (facela menos exacta)."
tools: [privacy_radar]
validator: { type: privacy_rubric, rubric: privacy_rubric.yaml }
points: 130
time_target_min: 5
hints:
  - { es: "La regla: lo que dice quién es la persona y no sirve para el análisis se elimina (first_name y address). Lo que no identifica a nadie se mantiene (patient_id, gender y deathdate, que hace falta para el protocolo).", gl: "A regra: o que di quen é a persoa e non serve para a análise elimínase (first_name e address). O que non identifica a ninguén mantense (patient_id, gender e deathdate, que fai falta para o protocolo)." }
  - { es: "ssn identifica a la persona, pero hace falta para juntar sus fichas repetidas: pseudonimizadlo (se cambia por un código). Os quedan birthdate y postal_code.", gl: "ssn identifica a persoa, pero fai falta para xuntar as súas fichas repetidas: pseudonimizádeo (cámbiase por un código). Quédanvos birthdate e postal_code." }
  - { es: "birthdate y postal_code sirven (edad, área sanitaria) pero son demasiado exactos: generalizad los dos (año de nacimiento y las 2 primeras cifras). Después, «Aplicar decisiones».", gl: "birthdate e postal_code serven (idade, área sanitaria) pero son demasiado exactos: xeneralizade os dous (ano de nacemento e as 2 primeiras cifras). Despois, «Aplicar decisións»." }
solution:
  es: "Mantener: patient_id, gender y deathdate. Pseudonimizar: ssn. Generalizar: birthdate y postal_code. Eliminar: first_name y address. Después, «Aplicar decisiones»."
  gl: "Manter: patient_id, gender e deathdate. Pseudonimizar: ssn. Xeneralizar: birthdate e postal_code. Eliminar: first_name e address. Despois, «Aplicar decisións»."
