id: r3c_modelo
room: R3
type: code
title: { es: "Modelo de reingreso", gl: "Modelo de reingreso" }
docs_needed: [doc_de_keys, doc_ds_ml]
story:
  es: "Ahora, el cálculo de verdad. Elegid las 3 piezas del modelo siguiendo vuestro protocolo, calculad y contad cuántos episodios salen marcados como reingreso. Esa cifra es el código (provisional: aún hay datos raros)."
  gl: "Agora, o cálculo de verdade. Elixide as 3 pezas do modelo seguindo o voso protocolo, calculade e contade cantos episodios saen marcados como reingreso. Esa cifra é o código (provisional: aínda hai datos raros)."
tools: [model_builder:int_admission_episodes+fct_admission, quick_checks]
answer_hint:
  es: "Un número: los reingresos que salen al pulsar «Episodios marcados como reingreso». Solo cifras."
  gl: "Un número: os reingresos que saen ao premer «Episodios marcados como reingreso». Só cifras."
answer: { source: "answers.public.json#r3c_readmissions_base", normalize: digits_only }
points: 160
time_target_min: 14
hints:
  - { es: "Las piezas son las reglas del protocolo que acabáis de contestar. Las tenéis en el recuadro «Vuestro protocolo».", gl: "As pezas son as regras do protocolo que acabades de contestar. Tédelas no recadro «O voso protocolo»." }
  - { es: "Solo cuentan los ingresos (inpatient). Si entre dos ingresos pasa un día o menos, son el mismo episodio.", gl: "Só contan os ingresos (inpatient). Se entre dous ingresos pasa un día ou menos, son o mesmo episodio." }
  - { es: "Ingreso: solo inpatient. Episodio nuevo: si pasa más de 1 día. Ventana: entre 2 y 30 días. Calculad y pulsad «Episodios marcados como reingreso».", gl: "Ingreso: só inpatient. Episodio novo: se pasa máis de 1 día. Ventá: entre 2 e 30 días. Calculade e premede «Episodios marcados como reingreso»." }
solution:
  es: "Piezas: «Solo ingresos (inpatient)», «Episodio nuevo si pasa más de 1 día» y «Entre 2 y 30 días». Pulsad «▶ Calcular» y después «Episodios marcados como reingreso»: salen {answer}. Escribid {answer}."
  gl: "Pezas: «Só ingresos (inpatient)», «Episodio novo se pasa máis de 1 día» e «Entre 2 e 30 días». Premede «▶ Calcular» e despois «Episodios marcados como reingreso»: saen {answer}. Escribide {answer}."
