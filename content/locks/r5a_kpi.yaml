id: r5a_kpi
room: R5
type: decision
title: { es: "KPI con sentido", gl: "KPI con sentido" }
docs_needed: [doc_analyst_requests]
story:
  es: "Definid el indicador que verá la Comisión. Mirad la tabla: la Clínica Illas Cíes tiene 3 ingresos y un 100 % de reingresos, porque con tan pocos casos un solo reingreso mueve la tasa 33 puntos. Elegid cómo se calcula la tasa, desde cuántas altas es fiable y qué hacéis con ese centro."
  gl: "Definide o indicador que verá a Comisión. Mirade a táboa: a Clínica Illas Cíes ten 3 ingresos e un 100 % de reingresos, porque con tan poucos casos un só reingreso move a taxa 33 puntos. Elixide como se calcula a taxa, desde cantas altas é fiable e que facedes con ese centro."
tools: [kpi_form]
answer: { source: "build_answers.public.json#r5a_kpi", normalize: report }
# any minimum that leaves out the 3-case clinic and keeps every real hospital (the smallest has 317 discharges) is valid
numeric_ranges:
  - { field: min_n, min: 4, max: 317, canonical: n30 }
points: 100
time_target_min: 6
hints:
  - { es: "La tasa se calcula sobre altas, no sobre pacientes (una persona puede tener varias altas): «Reingresos a 30 días / altas del periodo».", gl: "A taxa calcúlase sobre altas, non sobre pacientes (unha persoa pode ter varias altas): «Reingresos a 30 días / altas do período»." }
  - { es: "El mínimo de altas tiene que dejar fuera solo a la Clínica Illas Cíes (3 altas): vale cualquier número entre 4 y 317. Lo habitual en indicadores hospitalarios es 25-30.", gl: "O mínimo de altas ten que deixar fóra só a Clínica Illas Cíes (3 altas): vale calquera número entre 4 e 317. O habitual en indicadores hospitalarios é 25-30." }
  - { es: "A la Clínica Illas Cíes ni se la oculta ni se la pone como si nada: «Mostrarla aparte, con un aviso de pocos casos».", gl: "Á Clínica Illas Cíes nin se oculta nin se pon coma se nada: «Amosala á parte, cun aviso de poucos casos»." }
solution:
  es: "Tasa: «Reingresos a 30 días / altas del periodo». Mínimo de altas: por ejemplo 30 (vale de 4 a 317). Clínica Illas Cíes: «Mostrarla aparte, con un aviso de pocos casos»."
  gl: "Taxa: «Reingresos a 30 días / altas do período». Mínimo de altas: por exemplo 30 (vale de 4 a 317). Clínica Illas Cíes: «Amosala á parte, cun aviso de poucos casos»."
