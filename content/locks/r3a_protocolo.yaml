id: r3a_protocolo
room: R3
type: decision
title: { es: "El protocolo", gl: "O protocolo" }
docs_needed: [doc_analyst_requests]
story:
  es: "La Comisión tiene un documento oficial, el Protocolo v3, que dice exactamente qué es un reingreso. Leedlo y contestad las 4 preguntas: con ellas se configura el cálculo."
  gl: "A Comisión ten un documento oficial, o Protocolo v3, que di exactamente que é un reingreso. Ledeo e contestade as 4 preguntas: con elas configúrase o cálculo."
tools: [protocol_doc]
answer: { source: "build_answers.public.json#r3a_protocolo", normalize: report }
points: 120
time_target_min: 8
hints:
  - { es: "Las 4 respuestas están en el papel: cuántos días, qué hacer con ingresos muy seguidos, qué visitas cuentan y a quién se excluye.", gl: "As 4 respostas están no papel: cantos días, que facer con ingresos moi seguidos, que visitas contan e a quen se exclúe." }
  - { es: "Punto 2 del protocolo: dos ingresos separados por un día o menos son el mismo episodio. Punto 3: urgencias y consultas no son ingresos.", gl: "Punto 2 do protocolo: dous ingresos separados por un día ou menos son o mesmo episodio. Punto 3: urxencias e consultas non son ingresos." }
  - { es: "Ventana: 30 días naturales. Ingresos separados por un día o menos: se fusionan. Para las otras dos, leed los puntos 3 y 4.", gl: "Ventá: 30 días naturais. Ingresos separados por un día ou menos: fusiónanse. Para as outras dúas, lede os puntos 3 e 4." }
solution:
  es: "Ventana de reingreso: «30 días naturales». ¿Se fusionan?: «Sí, forman un solo episodio». Qué cuenta: «Solo inpatient». Exclusiones: «Registros posteriores al fallecimiento»."
  gl: "Ventá de reingreso: «30 días naturais». Fusiónanse?: «Si, forman un só episodio». Que conta: «Só inpatient». Exclusións: «Rexistros posteriores ao falecemento»."
