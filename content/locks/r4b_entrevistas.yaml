id: r4b_entrevistas
room: R4
type: interview
title: { es: "Entrevistas", gl: "Entrevistas" }
docs_needed: [doc_ds_analysis]
story:
  es: "Vuestra cifra de reingresos es provisional: unos detectores automáticos han encontrado tres grupos de registros que no tienen sentido (abajo, una tarjeta por problema). Los datos dicen QUÉ está mal, pero no POR QUÉ. Preguntad a Noa (Informática) y a Brais (Admisiones) por cada problema hasta saber la causa. Seguid cuando queráis."
  gl: "A vosa cifra de reingresos é provisional: uns detectores automáticos atoparon tres grupos de rexistros que non teñen sentido (abaixo, unha tarxeta por problema). Os datos din QUE está mal, pero non POR QUE. Preguntade a Noa (Informática) e a Brais (Admisións) por cada problema ata saber a causa. Seguide cando queirades."
tools: [npc_chat]
validator: { type: interview, required_clues: 2, clues: [C1, C2, C3] }
points: 120
time_target_min: 8
hints:
  - { es: "Cada tarjeta tiene su experto. Las altas y reingresos del mismo día pasan en un solo centro desde una fecha: es cosa de sistemas, preguntad a Noa por el centro H3 y la migración de marzo de 2019.", gl: "Cada tarxeta ten o seu experto. As altas e reingresos do mesmo día pasan nun só centro desde unha data: é cousa de sistemas, preguntádelle a Noa polo centro H3 e a migración de marzo de 2019." }
  - { es: "Las estancias negativas son un error al apuntar la hora: preguntad a Brais (Admisiones) cómo registran las altas en el turno de noche.", gl: "As estadías negativas son un erro ao apuntar a hora: preguntádelle a Brais (Admisións) como rexistran as altas na quenda de noite." }
  - { es: "Las visitas después del fallecimiento también son de Brais: preguntadle cómo y cuándo les llegan los registros de defunciones. Con las tres causas, «Terminar las entrevistas y seguir».", gl: "As visitas despois do falecemento tamén son de Brais: preguntádelle como e cando lles chegan os rexistros de defuncións. Coas tres causas, «Rematar as entrevistas e seguir»." }
solution:
  es: "Preguntad a Noa: «¿Qué ocurrió en el centro H3 con la migración de marzo de 2019?». Y a Brais: «¿Cómo registráis las altas en el turno de noche?» y «¿Cómo y cuándo os llegan los registros de defunciones?». Después, «Terminar las entrevistas y seguir»."
  gl: "Preguntade a Noa: «Que ocorreu no centro H3 coa migración de marzo de 2019?». E a Brais: «Como rexistrades as altas na quenda de noite?» e «Como e cando vos chegan os rexistros de defuncións?». Despois, «Rematar as entrevistas e seguir»."
