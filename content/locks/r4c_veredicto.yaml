hints:
  - { es: "Ninguno se arregla inventando datos. Pensad: ¿se quita y se apunta por qué, o hay que avisar al hospital?", gl: "Ningún se arranxa inventando datos. Pensade: quítase e apúntase por que, ou hai que avisar ao hospital?" }
  - { es: "La fragmentación ya la resuelve la regla de fusionar episodios: basta con documentarla. Lo que tiene que ver con fallecimientos lo tiene que revisar el hospital.", gl: "A fragmentación xa a resolve a regra de fusionar episodios: abonda con documentala. O que ten que ver con falecementos tense que revisar o hospital." }
  - { es: "Altas y reingresos del mismo día → documentar. Encuentros tras el fallecimiento → excluir y escalar. Os queda decidir las estancias negativas.", gl: "Altas e reingresos do mesmo día → documentar. Encontros tras o falecemento → excluír e escalar. Quédavos decidir as estadías negativas." }
solution:
  es: "Altas y reingresos del mismo día → «Ya cubierto por la fusión de episodios: documentar». Estancias negativas → «Excluir y documentar». Encuentros posteriores al fallecimiento → «Excluir y escalar al hospital»."
  gl: "Altas e reingresos do mesmo día → «Xa cuberto pola fusión de episodios: documentar». Estadías negativas → «Excluír e documentar». Encontros posteriores ao falecemento → «Excluír e escalar ao hospital»."
