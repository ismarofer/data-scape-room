title: { es: "La bandeja de entrada", gl: "A caixa de entrada" }
docs_needed: [doc_de_specs]
story:
  es: "Cuatro hospitales han enviado 8 ficheros y cada uno viene «a su manera»: con otro separador, otra codificación u otro formato de fecha. Tenéis que leerlos bien: que se vean las columnas, los acentos y las fechas. Ojo: la hoja de especificaciones tiene algún error."
  gl: "Catro hospitais enviaron 8 ficheiros e cada un vén «á súa maneira»: con outro separador, outra codificación ou outro formato de data. Tedes que lelos ben: que se vexan as columnas, os acentos e as datas. Ollo: a folla de especificacións ten algún erro."
tools: [load_wizard]
answer: { source: "build_answers.public.json#r1a_bandeja", normalize: report }
