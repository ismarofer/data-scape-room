solution:
  es: "patients: coma, UTF-8, sin fechas. organizations: barra vertical, UTF-8, sin fechas. conditions: tabulador, Latin-1, sin fechas. encounters_H1 y H2_reenvio: coma, UTF-8, 2023-01-31 14:05:00. encounters_H2: coma, Latin-1, 2023-01-31 14:05:00. encounters_H3: punto y coma, Latin-1, 31/01/2023 14:05. encounters_H4: tabulador, UTF-8, 2023-01-31 14:05:00 (17 filas rechazadas: es lo correcto). Cargad los 8 y pulsad «Validar carga»."
