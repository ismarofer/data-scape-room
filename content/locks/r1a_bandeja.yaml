hints:
  - { es: "Cómo leer la vista previa: una sola columna gigante = separador mal; Ã³ o � en vez de tildes = codificación mal; filas en rojo = formato de fecha mal. Ya resueltos: patients, encounters_H1 y encounters_H2_reenvio van con coma y UTF-8 (patients sin fechas; los otros, 2023-01-31 14:05:00).", gl: "Como ler a vista previa: unha soa columna xigante = separador mal; Ã³ ou � no canto de tiles = codificación mal; filas en vermello = formato de data mal. Xa resoltos: patients, encounters_H1 e encounters_H2_reenvio van con coma e UTF-8 (patients sen datas; os outros, 2023-01-31 14:05:00)." }
