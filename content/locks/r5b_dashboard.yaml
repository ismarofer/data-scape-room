id: r5b_dashboard
room: R5
type: chart
title: { es: "Constructor de dashboard", gl: "Construtor de dashboard" }
docs_needed: [doc_analyst_style]
story:
  es: "Cread el cuadro de mando (dashboard) para la Comisión: entre 3 y 4 gráficos. En cada uno elegís el tipo, qué dato se muestra y por qué se reparte (centro, edad, área, mes o año). Pensad qué pregunta responde cada uno. En el siguiente nivel lo revisa un crítico."
  gl: "Creade o cadro de mando (dashboard) para a Comisión: entre 3 e 4 gráficos. En cada un elixides o tipo, que dato se amosa e por que se reparte (centro, idade, área, mes ou ano). Pensade que pregunta responde cada un. No seguinte nivel revísao un crítico."
tools: [dashboard_builder]
validator: { type: chart_rules, mode: build }
points: 120
time_target_min: 8
hints:
  - { es: "Cada gráfico responde una pregunta de la Comisión. La primera, «¿qué centro reingresa más?»: barras · tasa de reingreso · por centro (la tasa, no el número: los centros tienen tamaños distintos).", gl: "Cada gráfico responde unha pregunta da Comisión. A primeira, «que centro reingresa máis?»: barras · taxa de reingreso · por centro (a taxa, non o número: os centros teñen tamaños distintos)." }
  - { es: "La segunda, «¿cómo evoluciona?»: línea · tasa · por mes (la línea, solo para el tiempo). Nada de tartas ni donuts: las porciones no se comparan bien.", gl: "A segunda, «como evoluciona?»: liña · taxa · por mes (a liña, só para o tempo). Nada de tortas nin donuts: as porcións non se comparan ben." }
  - { es: "La tercera, «¿a quién le pasa más?»: barras · tasa · por tramo de edad. Con esos tres gráficos, «Pasar al crítico».", gl: "A terceira, «a quen lle pasa máis?»: barras · taxa · por tramo de idade. Con eses tres gráficos, «Pasar ao crítico»." }
solution:
  es: "Añadid 3 gráficos: barras · tasa de reingreso · por centro; línea · tasa · por mes; barras · tasa · por tramo de edad. Pulsad «Pasar al crítico»."
  gl: "Engadide 3 gráficos: barras · taxa de reingreso · por centro; liña · taxa · por mes; barras · taxa · por tramo de idade. Premede «Pasar ao crítico»."
